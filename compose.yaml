services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: webguard
      POSTGRES_USER: webguard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a local password}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - webguard-db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U webguard -d webguard']
      interval: 5s
      retries: 10
volumes:
  webguard-db:
